[project]
name = "footnote"
version = "0.1.0"
description = "An agent that answers questions about SEC filings and shows exactly where every number came from."
readme = "README.md"
authors = [
    { name = "Camellia Bai", email = "138811454+cbai96cbai@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastembed>=0.9.1",
    "huggingface-hub>=1.33.0",
    "jinja2>=3.1.6",
    "numpy>=2.5.4",
    "openai>=3.45.0",
    "pydantic>=2.14.2",
    "pypdfium2>=5.14.0",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.14.0",
    "typer>=0.27.3",
]

[project.scripts]
footnote = "footnote.cli:app"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fpdf2>=2.9.0",
    "mypy>=2.4.1",
    "playwright>=1.64.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live and not corpus'"
markers = [
    "live: calls the Azure OpenAI API (excluded by default and in CI)",
    "corpus: needs the downloaded filings corpus (excluded by default and in CI)",
]

[tool.uv]
# this Mac is Intel; recent onnxruntime (a fastembed dependency) has no wheel for it
constraint-dependencies = ["onnxruntime<1.24"]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[[tool.mypy.overrides]]
module = ["pypdfium2", "rank_bm25"]
ignore_missing_imports = true
